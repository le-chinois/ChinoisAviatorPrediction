name: Construire APK

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Décompresser le projet
        run: |
          unzip -o ChinoisAviatorPredictionV2_1.zip -d projet
          find projet -maxdepth 3 -type f | head -50

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Construire APK
        working-directory: projet/AviatorPredictionV2
        run: gradle assembleDebug

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Aviator-Prediction-APK
          path: projet/AviatorPredictionV2/app/build/outputs/apk/debug/app-debug.apk
